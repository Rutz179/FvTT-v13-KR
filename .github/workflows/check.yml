# push / PR 때마다 ko.json 을 검사합니다 (JSON 문법, 치환자, HTML 태그, 용어집).
name: Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/l10n.py status
      - run: python tools/l10n.py check
